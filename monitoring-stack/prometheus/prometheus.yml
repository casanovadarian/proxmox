global:
  # Intervalo por defecto para raspar (scrape) métricas
  scrape_interval: 15s 

# Una lista de configuraciones de scraping para diferentes trabajos (jobs)
scrape_configs:

  # Job para el Proxmox 1
  - job_name: 'proxmox-1'
    metrics_path: /pve
    params:
      module: [default]
      target: [10.12.118.1] 
    static_configs:
      - targets: ['10.12.118.1:9221']
    relabel_configs:
      - target_label: instance
        replacement: 10.12.118.1

  # Job para el Proxmox 2
  - job_name: 'proxmox-2'
    metrics_path: /pve
    params:
      module: [default]
      target: [10.12.118.2]
    static_configs:
      - targets: ['10.12.118.2:9221']
    relabel_configs:
      - target_label: instance
        replacement: 10.12.118.2

  # Job para el Proxmox 3
  - job_name: 'proxmox-3'
    metrics_path: /pve
    params:
      module: [default]
      target: [10.12.118.3]
    static_configs:
      - targets: ['10.12.118.3:9221']
    relabel_configs:
      - target_label: instance
        replacement: 10.12.118.3