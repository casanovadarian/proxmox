server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://10.12.112.235:3100/loki/api/v1/push # Tu IP de Loki en Docker

  - job_name: journal
    journal:
      max_age: 12h
      labels:
        job: system-journal
        node: pm-132
    relabel_configs:
      - source_labels: ['__journal__systemd_unit']
        target_label: 'unit'

  - job_name: pve-tasks
    static_configs:
    - targets:
        - localhost
      labels:
        job: pve-tasks
        node: pm-132
        # El asterisco simple /*/ es más seguro para evitar el error de "es un directorio"
        __path__: /var/log/pve/tasks/*/UPID*

    relabel_configs:
      # Extraer la ACCIÓN (ej. qmstop)
      - source_labels: [__path__]
        regex: '.*UPID:[^:]+:[^:]+:[^:]+:[^:]+:([^:]+):([^:]+):([^:]+):'
        target_label: pve_action
        replacement: '$1'
      # Extraer el ID de la VM/CT (ej. 111)
      - source_labels: [__path__]
        regex: '.*UPID:[^:]+:[^:]+:[^:]+:[^:]+:([^:]+):([^:]+):([^:]+):'
        target_label: vmid
        replacement: '$2'
      # Extraer el USUARIO (ej. uclv@pve)
      - source_labels: [__path__]
        regex: '.*UPID:[^:]+:[^:]+:[^:]+:[^:]+:([^:]+):([^:]+):([^:]+):'
        target_label: user
